<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Steeped in Portland — Waitlist Vol. 001</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
/* Steeped in Portland — waitlist */

:root {
  --ink: #0a0a09;
  --paper: #f2efe9;
  --paper-dim: #e2ddd2;
  --rule: rgba(242, 239, 233, 0.18);
  --rule-strong: rgba(242, 239, 233, 0.4);
  --mute: rgba(242, 239, 233, 0.55);
  --serif: "Instrument Serif", "Cormorant Garamond", "Times New Roman", serif;
  --sans: "Newsreader", "Iowan Old Style", Georgia, serif;
  --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

body { min-height: 100vh; font-size: 17px; line-height: 1.55; letter-spacing: 0.005em; }

::selection { background: var(--paper); color: var(--ink); }

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; background: none; border: 0; outline: none; }
a { color: inherit; }

.grain::before {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.94  0 0 0 0 0.91  0 0 0 0.10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mix-blend-mode: screen;
  opacity: 0.4;
  z-index: 2;
}

.frame { max-width: 1440px; margin: 0 auto; padding: 0 56px; }
@media (max-width: 720px) { .frame { padding: 0 22px; } }

.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mute); }
.index { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; color: var(--mute); }
.hr { height: 1px; background: var(--rule); width: 100%; }
.hr-strong { background: var(--rule-strong); }
.serif-display { font-family: var(--serif); font-weight: 400; letter-spacing: -0.015em; line-height: 0.92; }

/* ─── Top bar ─── */

.topbar {
  position: relative; z-index: 5;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 56px;
  border-bottom: 1px solid var(--rule);
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute);
}
.topbar .mid {
  position: absolute; left: 50%; transform: translateX(-50%);
  white-space: nowrap;
}
@media (max-width: 720px) { .topbar { padding: 8px 22px; gap: 16px; } .topbar .mid { display: none; } .mark-logo { width: 40px; height: 40px; } }

.topbar .mark { display: inline-flex; align-items: center; gap: 10px; color: var(--paper); }
.mark-logo { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #fff; }
.topbar .rt { display: flex; gap: 24px; }

/* ─── Hero ─── */

.hero { position: relative; overflow: hidden; }

.hero-art {
  position: relative;
  aspect-ratio: 16 / 9;
  min-height: 380px;
  background: #000;
  border-bottom: 1px solid var(--rule-strong);
  overflow: hidden;
}
@media (max-width: 900px) { .hero-art { min-height: 420px; aspect-ratio: 4/3; } }

.banner-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center top;
  opacity: 1;
}

.banner-caption {
  position: absolute; left: 24px; bottom: 18px; z-index: 3;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mute);
  display: flex; gap: 14px; align-items: center;
}
.banner-caption .dot { width: 6px; height: 6px; background: var(--paper); display: inline-block; }

.hero-headline {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 0 56px 56px; z-index: 3;
  background: linear-gradient(to top, rgba(10,10,9,0.85) 0%, rgba(10,10,9,0.3) 50%, transparent 100%);
}
@media (max-width: 720px) { .hero-headline { padding: 0 22px 28px; } }

.hero-meta {
  display: flex; gap: 18px; align-items: baseline; margin-bottom: 22px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mute);
  flex-wrap: wrap;
}
.hero-meta b { color: var(--paper); font-weight: 500; }
.hero-meta .sep { width: 18px; height: 1px; background: var(--rule-strong); display: inline-block; }

.hero-title {
  font-family: var(--serif);
  font-size: clamp(54px, 9.5vw, 156px);
  line-height: 0.88; letter-spacing: -0.025em; font-weight: 400;
  max-width: 14ch;
}
.hero-title i { font-style: italic; font-family: var(--serif); }

.hero-sub {
  margin-top: 26px; max-width: 56ch;
  font-family: var(--sans); font-size: 18px; line-height: 1.45;
  color: var(--paper); opacity: 0.85;
}

/* Hero overlays (rebuilt) */
.hero-top-text { position: absolute; left: 50%; top: 6.5%; transform: translateX(-50%); z-index: 3; width: min(900px, 90%); text-align: center; }
.hero-lede { font-family: var(--serif); font-size: clamp(20px, 2.7vw, 38px); line-height: 1.08; letter-spacing: -0.02em; color: var(--paper); }
.hero-deck { margin: 12px auto 0; max-width: 60ch; font-family: var(--sans); font-size: clamp(12px, 1.25vw, 15px); line-height: 1.5; color: var(--paper); opacity: 0.82; }
.hero-cta { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-family: var(--mono); font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; padding: 18px 34px; background: var(--ink); color: var(--paper); border: 1.5px solid var(--paper); border-radius: 2px; white-space: nowrap; box-shadow: 0 8px 22px rgba(0,0,0,0.5), 0 0 22px 4px rgba(245,239,228,0.32); transition: background 0.2s, color 0.2s, box-shadow 0.2s; }
.cta-band { display: flex; justify-content: center; padding: 30px 22px 4px; }
.hero-cta:hover { background: var(--paper); color: var(--ink); box-shadow: 0 14px 30px rgba(0,0,0,0.55), 0 0 26px 5px rgba(245,239,228,0.4); }
@media (max-width: 720px) { .hero-top-text { top: 5%; width: 92%; background: radial-gradient(ellipse at center, rgba(20,18,16,0.6) 0%, rgba(20,18,16,0.32) 55%, rgba(20,18,16,0) 80%); padding: 18px 14px; border-radius: 14px; } .hero-lede { font-size: clamp(12px, 3.3vw, 16px); line-height: 1.14; text-shadow: 0 1px 10px rgba(0,0,0,0.45); } .hero-deck { font-size: clamp(9px, 2.4vw, 11px); margin-top: 7px; text-shadow: 0 1px 10px rgba(0,0,0,0.45); } .hero-cta { font-size: 10px; padding: 14px 22px; letter-spacing: 0.1em; } .cta-band { padding: 20px 22px 0; } }
.strip-lede { font-family: var(--serif); font-style: italic; font-size: clamp(16px, 1.8vw, 22px); line-height: 1.3; color: var(--paper); opacity: 0.7; padding: 40px 56px 0; max-width: 60ch; }
@media (max-width: 900px) { .strip-lede { padding: 22px 22px 0; } }

/* Manifesto strip */
.strip {
  display: grid; grid-template-columns: 1.2fr 2.5fr;
  gap: 48px; align-items: start;
  padding: 64px 56px; border-bottom: 1px solid var(--rule);
}
@media (max-width: 900px) { .strip { grid-template-columns: 1fr; gap: 28px; padding: 28px 22px; } }
.strip .col-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mute); }
.strip .col-body { font-family: var(--serif); font-size: clamp(22px, 2.2vw, 34px); line-height: 1.15; letter-spacing: -0.01em; color: var(--paper); }
.strip .col-body em { font-style: italic; }
.strip .col-meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute); text-align: right; }
@media (max-width: 900px) { .strip .col-meta { text-align: left; } }

/* ─── Paths ─── */

.paths { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--rule); }
.paths-heading { grid-column: 1 / -1; margin: 0; padding: 44px 32px 8px; text-align: center; font-family: var(--serif); font-weight: 400; font-size: clamp(22px, 3vw, 34px); letter-spacing: -0.02em; color: var(--paper); }
@media (max-width: 720px) { .paths-heading { padding: 32px 22px 4px; font-size: clamp(20px, 6vw, 26px); } }
@media (max-width: 900px) { .paths { grid-template-columns: 1fr; } }

.path {
  position: relative; padding: 56px 56px 48px;
  border-right: 1px solid var(--rule); cursor: pointer;
  transition: background 0.5s ease; min-height: 380px;
  display: flex; flex-direction: column;
}
.path:last-child { border-right: 0; }
@media (max-width: 900px) { .path { padding: 44px 22px; min-height: auto; border-right: 0; border-bottom: 1px solid var(--rule); } }
.path:hover { background: rgba(242,239,233,0.03); }

.path-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 40px; }
.path-num { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mute); }
.path-tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mute); }

.path-title {
  font-family: var(--serif); font-size: clamp(32px, 3.5vw, 56px);
  line-height: 1.0; letter-spacing: -0.02em; font-weight: 400;
  margin-bottom: 24px; max-width: 18ch;
}
.path-title i { font-style: italic; }

.path-blurb { font-family: var(--sans); font-size: 16px; line-height: 1.55; color: var(--paper); opacity: 0.7; margin-bottom: 36px; max-width: 46ch; }



.path-cta {
  display: inline-block; align-self: flex-start;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  border: 1px solid var(--rule-strong); padding: 18px 28px;
  transition: all 0.25s ease; color: var(--paper);
}
.path:hover .path-cta { background: var(--paper); color: var(--ink); border-color: var(--paper); }

/* ─── Tenets ─── */

.tenets { padding: 80px 56px; border-bottom: 1px solid var(--rule); }
@media (max-width: 720px) { .tenets { padding: 56px 22px; } }
.tenets-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 56px; }
.tenets-head h2 { font-family: var(--serif); font-size: clamp(36px, 5vw, 72px); line-height: 0.92; letter-spacing: -0.025em; }
.tenets-head h2 i { font-style: italic; }
.pillars { border-top: 1px solid var(--rule); }
.pillar { display: grid; grid-template-columns: 1fr 2fr; gap: 40px; padding: 40px 0; border-bottom: 1px solid var(--rule); align-items: start; }
@media (max-width: 760px){ .pillar { grid-template-columns: 1fr; gap: 16px; padding: 32px 0; } }
.pillar-num { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; color: var(--mute); margin-bottom: 14px; }
.pillar-title { font-family: var(--serif); font-size: clamp(24px, 2.6vw, 38px); font-weight: 400; line-height: 1.05; letter-spacing: -0.015em; }
.pillar-title i { font-style: italic; }
.pillar-desc { font-family: var(--serif); font-style: italic; font-size: clamp(15px, 1.4vw, 18px); line-height: 1.5; color: var(--paper); opacity: 0.7; margin-bottom: 18px; max-width: 60ch; }
.pillar-points { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.pillar-points li { font-family: var(--sans); font-size: clamp(14px, 1.2vw, 16px); line-height: 1.5; color: var(--paper); opacity: 0.82; padding-left: 18px; position: relative; }
.pillar-points li::before { content: "\2014"; position: absolute; left: 0; color: var(--mute); }
.pillar .donate-btn { grid-column: 1 / -1; justify-self: center; margin-top: 26px; }
.tenets-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid var(--rule); }
@media (max-width: 900px) { .tenets-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .tenets-grid { grid-template-columns: 1fr; } }
.tenet { padding: 32px 32px 32px 28px; border-right: 1px solid var(--rule); }
.tenet:last-child { border-right: 0; padding-right: 0; }
@media (max-width: 900px) { .tenet { border-right: 1px solid var(--rule); padding: 28px 20px 28px 20px; } .tenet:nth-child(2n) { border-right: 0; } }
.tenet .num { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; color: var(--mute); margin-bottom: 20px; }
.tenet h3 { font-family: var(--serif); font-size: clamp(20px, 2vw, 28px); font-weight: 400; line-height: 1.1; margin-bottom: 14px; }
.tenet h3 i { font-style: italic; }
.tenet p { font-family: var(--sans); font-size: 14px; line-height: 1.6; color: var(--paper); opacity: 0.65; }

/* ─── Form ─── */

.form-wrap { display: grid; grid-template-columns: 1fr 1.4fr; min-height: 100vh; }
@media (max-width: 980px) { .form-wrap { grid-template-columns: 1fr; } }

.form-side {
  padding: 40px 56px; border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; gap: 24px; position: sticky; top: 0; height: 100vh; overflow: hidden;
}
@media (max-width: 980px) { .form-side { display: none; } }

.corner { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mute); }
.form-back { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute); padding: 0; text-align: left; }
.form-back:hover { color: var(--paper); }
.form-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mute); margin-top: 24px; }
.form-title { font-family: var(--serif); font-size: clamp(40px, 5vw, 72px); line-height: 0.92; letter-spacing: -0.025em; }
.form-title i { font-style: italic; }
.form-desc { font-family: var(--sans); font-size: 16px; line-height: 1.55; color: var(--paper); opacity: 0.7; max-width: 40ch; }

.form-quote { font-family: var(--serif); font-style: italic; font-size: 18px; line-height: 1.4; color: var(--paper); opacity: 0.55; border-top: 1px solid var(--rule); padding-top: 24px; max-width: 38ch; }
.form-quote-cite { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mute); margin-top: 14px; font-style: normal; }

.form-inputs { padding: 80px 56px; display: flex; flex-direction: column; gap: 0; }
@media (max-width: 980px) { .form-inputs { padding: 48px 22px; } }

.field { display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--rule); padding: 22px 0; }
.field-label { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mute); }
.field-label .n { color: var(--mute); }
.field-input { font-family: var(--serif); font-size: 28px; letter-spacing: -0.01em; padding: 6px 0 4px; color: var(--paper); width: 100%; }
.field-input::placeholder { color: var(--paper); opacity: 0.25; font-style: italic; }
.field-input:-webkit-autofill,
.field-input:-webkit-autofill:hover,
.field-input:-webkit-autofill:focus,
.field-input:-webkit-autofill:active {
  -webkit-text-fill-color: var(--paper);
  -webkit-box-shadow: 0 0 0 1000px var(--ink) inset;
  caret-color: var(--paper);
  transition: background-color 9999s ease-in-out 0s;
}

.choices { display: flex; gap: 0; margin-top: 6px; flex-wrap: wrap; width: 100%; }
.choice {
  flex: 1; min-width: min(fit-content, 100%); padding: 12px 14px;
  border: 1px solid var(--rule-strong); margin-right: -1px; margin-bottom: -1px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--paper); text-align: left; background: transparent; cursor: pointer;
  transition: all 0.18s ease; display: flex; align-items: center; gap: 12px;
}
.choice:hover { background: rgba(242,239,233,0.05); }
.choice[data-selected="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); position: relative; z-index: 1; }
.choice .box { width: 12px; height: 12px; border: 1px solid currentColor; display: inline-block; flex-shrink: 0; }
.choice[data-selected="true"] .box { background: var(--ink); }

.textarea-input { font-family: var(--sans); font-size: 17px; line-height: 1.5; width: 100%; resize: none; padding: 6px 0 4px; min-height: 64px; }
.textarea-input::placeholder { color: var(--paper); opacity: 0.25; font-style: italic; }

.submit-row { display: flex; justify-content: space-between; align-items: center; margin-top: 36px; gap: 22px; flex-wrap: wrap; }
.submit-meta { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mute); max-width: 32ch; line-height: 1.6; }
.submit-btn { padding: 20px 28px; background: var(--paper); color: var(--ink); font-family: var(--mono); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 16px; border: 1px solid var(--paper); transition: all 0.2s ease; }
.submit-btn:hover { background: transparent; color: var(--paper); }
.submit-btn[disabled] { opacity: 0.3; cursor: not-allowed; }
.submit-btn .arrow { font-family: var(--serif); font-size: 22px; line-height: 0; }

/* ─── Thank you ─── */

.thanks { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .thanks { grid-template-columns: 1fr; } }

.thanks-left { padding: 80px 56px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--rule); min-height: 100vh; }
@media (max-width: 900px) { .thanks-left { border-right: 0; border-bottom: 1px solid var(--rule); min-height: auto; padding: 60px 22px; } }

.thanks-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mute); margin-bottom: 36px; }
.thanks-h { font-family: var(--serif); font-size: clamp(52px, 8vw, 132px); line-height: 0.88; letter-spacing: -0.025em; margin-bottom: 32px; }
.thanks-h i { font-style: italic; }
.thanks-body { font-family: var(--sans); font-size: 18px; line-height: 1.55; max-width: 46ch; color: var(--paper); opacity: 0.85; margin-bottom: 40px; }

.thanks-receipt { border-top: 1px solid var(--rule); padding-top: 24px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute); display: grid; grid-template-columns: auto 1fr; gap: 8px 24px; }
.thanks-receipt b { color: var(--paper); font-weight: 500; }

.thanks-right {
  background: #0a0a09;
  color: var(--paper);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
@media (max-width: 900px) { .thanks-right { min-height: auto; } }

.thanks-photo {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: hidden;
}

.thanks-figure-img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
}

.thanks-photo-caption { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(10,10,9,0.5); display: flex; gap: 14px; align-items: center; }
.thanks-photo-caption .dot { width: 6px; height: 6px; background: var(--ink); display: inline-block; }
.thanks-tag { position: absolute; top: 32px; right: 32px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(10,10,9,0.5); }

/* ─── Footer ─── */

.footer { padding: 44px 56px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; border-top: 1px solid var(--rule); font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute); align-items: stretch; }
.footer > div { display: flex; flex-direction: column; justify-content: flex-end; }
@media (max-width: 720px) { .footer { font-size: 9px; grid-template-columns: 1fr; padding: 24px 22px 20px; row-gap: 16px; text-align: center; justify-items: center; } .footer > div { align-items: center; } .footer .col-h { margin-bottom: 8px; } }
.footer .col-h { color: var(--paper); margin-bottom: 14px; font-size: 10px; }
.footer .stamp { text-align: right; }
@media (max-width: 720px) { .footer .stamp { text-align: center; font-size: 9px; } }

/* ─── Ticker ─── */

.ticker { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); overflow: hidden; padding: 18px 0; }
.ticker-track { display: inline-flex; white-space: nowrap; animation: marquee 56s linear infinite; gap: 48px; font-family: var(--serif); font-style: italic; font-size: clamp(28px, 4vw, 56px); letter-spacing: -0.01em; color: var(--paper); }
.ticker-track span { display: inline-flex; align-items: center; gap: 48px; }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

const TWEAK_DEFAULTS = { "heroVariant": "manifesto", "showTenets": true, "headlineCase": "mixed" };

function App() {
  const [tweaks, setTweak] = window.useTweaks ? window.useTweaks(TWEAK_DEFAULTS) : [TWEAK_DEFAULTS, () => {}];
  const [count, setCount] = useState(null);
  useEffect(() => {
    if (SCRIPT_URL) {
      fetch(SCRIPT_URL).then(r => r.json()).then(d => setCount(d.count)).catch(() => {});
    }
  }, []);
  const [screen, setScreen] = useState("landing");
  const [showPaths, setShowPaths] = useState(false);
  const [path, setPath] = useState(null);
  const [form, setForm] = useState({ firstName: "", lastName: "", email: "", city: "", answers: {} });

  // Dev shortcut: open file.html#thanks (or #form) to jump straight there.
  // Lets you preview screens without filling out the form.
  useEffect(() => {
    const hash = window.location.hash.replace('#', '');
    if (hash === 'thanks') {
      setForm({ firstName: 'Test', lastName: 'User', email: 'test@example.com', city: 'Portland', answers: {} });
      setPath('everyone');
      setScreen('thanks');
    } else if (hash === 'form') {
      setPath('everyone');
      setScreen('form');
    }
  }, []);

  const goHome = () => { setForm({ firstName:'', lastName:'', email:'', city:'', answers:{} }); setShowPaths(false); setScreen('landing'); window.scrollTo({top:0,behavior:'instant'}); };

  const go = (next, p) => {
    if (p) setPath(p);
    setScreen(next);
    window.scrollTo({ top: 0, behavior: "instant" });
  };

  const handleSubmit = (answersOverride) => {
    const b = BRANCHES[path];
    const answers = answersOverride || form.answers;
    const out = {};
    b.questions.forEach((qq) => {
      const v = answers[qq.id];
      out[qq.id] = Array.isArray(v) ? v.join(qq.type === "rank" ? " > " : " | ") : (v || "");
      if (qq.other) out[qq.id + "_other"] = answers[qq.id + "_other"] || "";
    });
    const payload = {
      branch: path,
      role: b.label,
      firstName: form.firstName || "",
      lastName: form.lastName || "",
      email: form.email || "",
      city: form.city || "",
      answers: out,
    };
    fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) })
      .catch(e => console.error("Submission error:", e));
    go("thanks");
  };

  return (
    <>
      {screen === "landing" && <Landing tweaks={tweaks} count={count} showPaths={showPaths} onShowPaths={() => setShowPaths(true)} onPick={(p) => go("form", p)} onHome={goHome} onAbout={() => go("about")} />}
      {screen === "form" && (
        <FormScreen path={path} form={form} setForm={setForm} onBack={() => go("landing")} onSubmit={handleSubmit} onHome={goHome} count={count} onAbout={() => go("about")} />
      )}
      {screen === "thanks" && <Thanks path={path} form={form} onReset={goHome} onHome={goHome} count={count} onAbout={() => go("about")} />}
      {screen === "about" && <About onHome={goHome} onAbout={() => go("about")} />}

      {window.TweaksPanel && (
        <window.TweaksPanel title="Tweaks">
          <window.TweakSection label="Display">
            <window.TweakRadio label="Hero" value={tweaks.heroVariant} options={[{value:"manifesto",label:"Manifesto"},{value:"film",label:"Film Slate"}]} onChange={(v)=>setTweak("heroVariant",v)} />
            <window.TweakRadio label="Headline" value={tweaks.headlineCase} options={[{value:"mixed",label:"Editorial"},{value:"upper",label:"All Caps"}]} onChange={(v)=>setTweak("headlineCase",v)} />
            <window.TweakToggle label="Show tenets" value={tweaks.showTenets} onChange={(v)=>setTweak("showTenets",v)} />
          </window.TweakSection>
        </window.TweaksPanel>
      )}
    </>
  );
}

function FormScreen({ path, form, setForm, onBack, onSubmit, onHome, count, onAbout }) {
  const branch = BRANCHES[path];
  const qs = branch.questions;
  const groups = [];
  let idx = 0;
  branch.pages.forEach((n) => { groups.push(qs.slice(idx, idx + n)); idx += n; });
  const PAGES = [{ kind: "identifiers" }, ...groups.map((g) => ({ kind: "questions", qs: g }))];

  const [page, setPage] = useState(0);
  const total = PAGES.length;
  const cur = PAGES[page];

  const update = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const updateAns = (k, v) => setForm((f) => ({ ...f, answers: { ...f.answers, [k]: v } }));
  const titleCase = (s) => s.replace(/(^|\s)\S/g, (c) => c.toUpperCase());
  const clean = (o) => o.replace(/\*/g, "");
  const renderOpt = (o) => o.split(/(\*[^*]+\*)/g).map((p, i) => (p.length > 1 && p.charAt(0) === "*" && p.charAt(p.length - 1) === "*") ? <em key={i} className="opt-em">{p.slice(1, -1)}</em> : p);

  const emailOk = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((e || "").trim());
  const idReady = () =>
    (form.firstName || "").trim() && (form.lastName || "").trim() && emailOk(form.email) && (form.city || "").trim();

  const qReady = (q) => {
    const v = form.answers[q.id];
    if (q.type === "multi" || q.type === "rank") return Array.isArray(v) && v.length > 0;
    if (!v) return false;
    if (q.other && v === "Other") return (form.answers[q.id + "_other"] || "").trim().length > 0;
    return true;
  };
  const pageReady = () => (cur.kind === "identifiers" ? idReady() : cur.qs.every(qReady));

  const next = () => {
    if (page === total - 1) onSubmit();
    else { setPage((p) => p + 1); window.scrollTo({ top: 0, behavior: "instant" }); }
  };
  const back = () => {
    if (page === 0) onBack();
    else { setPage((p) => p - 1); window.scrollTo({ top: 0, behavior: "instant" }); }
  };
  const progress = (page / (total - 1)) * 100;

  const toggleMulti = (q, opt) => {
    const v = Array.isArray(form.answers[q.id]) ? form.answers[q.id] : [];
    updateAns(q.id, v.includes(opt) ? v.filter((x) => x !== opt) : [...v, opt]);
  };
  const toggleRank = (q, opt) => {
    let v = Array.isArray(form.answers[q.id]) ? [...form.answers[q.id]] : [];
    if (q.exclusive && opt === q.exclusive) { updateAns(q.id, v.includes(opt) ? [] : [opt]); return; }
    if (q.exclusive) v = v.filter((x) => x !== q.exclusive);
    v = v.includes(opt) ? v.filter((x) => x !== opt) : [...v, opt];
    updateAns(q.id, v);
  };

  return (
    <div className="fade-enter">
      <Topbar onHome={onHome} count={count} onAbout={onAbout} />
      <div className="step-wrap">
        <aside className="form-side">
          <button className="form-back" onClick={back}>← {page === 0 ? "Back to the front page" : "Previous"}</button>
          <div className="corner">{branch.short}</div>
          <div className="form-eyebrow">An Invitation · Waitlist Vol. 001</div>
          <h1 className="form-title">Tell us<br/><i>how you move.</i></h1>
          <p className="form-desc">We're letting Portland in first. The more honest you are, the better we build — together.</p>
          <blockquote className="form-quote">
            "The flavor is always evolving."
            <div className="form-quote-cite">— Steeped in Portland · 2026</div>
          </blockquote>
        </aside>

        <main className="step-main">
          <div className="step-progress"><div className="step-progress-fill" style={{ width: `${progress}%` }} /></div>
          <div className="step-counter">{String(page + 1).padStart(2, "0")} / {String(total).padStart(2, "0")}</div>

          {cur.kind === "identifiers" && (
            <div className="id-fields">
              <div className="step-question">First, the basics.</div>
              <div className="id-row">
                <input className="field-input" placeholder="First name" value={form.firstName || ""} autoFocus
                  onChange={(e) => update("firstName", titleCase(e.target.value))} />
                <input className="field-input" placeholder="Last name" value={form.lastName || ""}
                  onChange={(e) => update("lastName", titleCase(e.target.value))} />
              </div>
              <input className="field-input" type="email" placeholder="Email address" value={form.email || ""}
                onChange={(e) => update("email", e.target.value)} />
              {form.email && !emailOk(form.email) && <div className="field-err">Enter a valid email (name@domain.com).</div>}
              <input className="field-input" placeholder="City" value={form.city || ""}
                onChange={(e) => update("city", titleCase(e.target.value))} />
            </div>
          )}

          {cur.kind === "questions" && cur.qs.map((q, qi) => (
            <div className="q-block" key={q.id}>
              {qi > 0 && <hr className="q-divider" />}
              <div className="step-question">{q.q}</div>

              {q.type === "single" && (
                <div className="choices" style={{ flexDirection: "column" }}>
                  {q.options.map((opt) => { const o = clean(opt); return (
                    <button key={o} className="choice" style={{ flex: "none", width: "100%", maxWidth: 560 }}
                      data-selected={form.answers[q.id] === o} onClick={() => updateAns(q.id, o)}>
                      <span className="box" />{renderOpt(opt)}
                    </button>
                  ); })}
                  {q.other && form.answers[q.id] === "Other" && (
                    <input className="field-input other-input" placeholder="Tell us more"
                      value={form.answers[q.id + "_other"] || ""} onChange={(e) => updateAns(q.id + "_other", e.target.value)} />
                  )}
                </div>
              )}

              {q.type === "multi" && (
                <div className="choices" style={{ flexDirection: "column" }}>
                  {q.options.map((opt) => {
                    const sel = (form.answers[q.id] || []).includes(opt);
                    return (
                      <button key={opt} className="choice" style={{ flex: "none", width: "100%", maxWidth: 560 }}
                        data-selected={sel} onClick={() => toggleMulti(q, opt)}>
                        <span className="box" />{opt}
                      </button>
                    );
                  })}
                  {q.other && (form.answers[q.id] || []).includes("Other") && (
                    <input className="field-input other-input" placeholder="Tell us more"
                      value={form.answers[q.id + "_other"] || ""} onChange={(e) => updateAns(q.id + "_other", e.target.value)} />
                  )}
                  <p className="select-hint">Select all that apply</p>
                </div>
              )}

              {q.type === "rank" && (
                <div className="choices" style={{ flexDirection: "column" }}>
                  {q.options.map((opt) => {
                    const r = (form.answers[q.id] || []).indexOf(opt);
                    return (
                      <button key={opt} className="choice rank-choice" style={{ flex: "none", width: "100%", maxWidth: 560 }}
                        data-selected={r >= 0} onClick={() => toggleRank(q, opt)}>
                        <span className="rank-badge">{r >= 0 ? r + 1 : ""}</span>{opt}
                      </button>
                    );
                  })}
                  <p className="select-hint">Tap to rank in order — tap again to remove</p>
                </div>
              )}
            </div>
          ))}

          <div className="step-nav">
            <button className="step-back-btn" onClick={back}>← {page === 0 ? "Back" : "Previous"}</button>
            <button className="step-next-btn" disabled={!pageReady()} onClick={next}>
              {page === total - 1 ? "Submit" : "Continue"} <span style={{ fontFamily: "var(--serif)", fontSize: 22, lineHeight: 0 }}>→</span>
            </button>
          </div>
        </main>
      </div>
    </div>
  );
}
